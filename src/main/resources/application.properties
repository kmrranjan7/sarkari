spring.application.name=sarkari
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/sarkari_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.cache.type=caffeine
spring.cache.cache-names=postByPostId,postPages
spring.cache.caffeine.spec=initialCapacity=100,maximumSize=2000,expireAfterWrite=10m,recordStats

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

logging.level.root=INFO
logging.level.com.sarkari=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true

app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
app.uploads.base-dir=../my-app/public/uploads

app.security.api-key=${OPENAI_API_KEY}
